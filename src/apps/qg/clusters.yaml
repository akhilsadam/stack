vis: true
vis_every: 100
vis_folder: _output
clusters:
  - name: u-vel
    strings:
      - psi dy neg
      - u
      - u neg neg

  - name: zeros
    strings:
      - u dx v dy +
      - q 0.0 * 
      - psi 0.0 *

  - name: KE
    strings:
      - u square v square + 0.5 *
      - v square u square + 0.5 *
      - u square 0.5 * v square 0.5 * +

  - name: commutative
    strings:
      - q psi + 0.5 +
      - psi 0.5 + q +
      - q 0.5 + psi +

  - name: laplacian
    strings:
      - psi lap
      - q

  - name: jacobian
    strings:
      - q psi jacobian
      - psi q jacobian neg