vis: true
vis_every: 100
vis_folder: _output
clusters:
  - name: u
    strings:
      - psi dy neg
      - u
      - u neg neg

  - name: v
    strings:
      - psi dx
      - v
      - v neg neg

  - name: zero
    strings:
      - u dx v dy +
      - q 0.0 * 
      - psi 0.0 *

  - name: KE
    strings:
      - u square v square + 0.5 *
      - v square u square + 0.5 *
      - u square 0.5 * v square 0.5 * +
      - v square 0.5 * u square 0.5 * +

  - name: enstrophy
    strings:
      - q q 0.5 * *
      - q q * 0.5 *
      - q psi lap * 0.5 *
      - psi lap q * 0.5 *

  - name: q + psi + 0.5
    strings:
      - q psi + 0.5 +
      - psi 0.5 + q +
      - q 0.5 + psi +

  - name: vorticity
    strings:
      - psi lap
      - q invlap lap
      - q

  - name: streamfunction
    strings:
      - psi
      - q invlap

  - name: jacobian
    strings:
      - q psi jacobian
      - psi q jacobian neg